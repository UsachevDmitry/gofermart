services:
  db:
    container_name: postgresdb
    image: postgres:17.2
    env_file:
      - app.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd
    volumes:
      - gofermart:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  gofermart:
  